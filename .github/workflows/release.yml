name: Build LinePulse Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop builder dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows Portable ZIP
        working-directory: desktop
        run: npm run build:win:zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinePulse-Windows-x64
          path: dist-desktop/*.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop builder dependencies
        working-directory: desktop
        run: npm install
      - name: Build macOS Public DMG
        working-directory: desktop
        run: npm run build:mac:public
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinePulse-macOS-arm64
          path: dist-desktop/*.dmg
